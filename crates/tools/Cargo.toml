[package]
name = "vansoncraft-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VansonCraft tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
vansoncraft-geom = { workspace = true }
vansoncraft-color = { workspace = true }
vansoncraft-doc = { workspace = true }
vansoncraft-brush = { workspace = true }
vansoncraft-pathops = { workspace = true }
vansoncraft-effects = { workspace = true }
vansoncraft-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
vansoncraft-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
