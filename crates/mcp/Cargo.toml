[package]
name = "vansoncraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VansonCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts vansoncraft-text bundles for documents, through the engine's `bundled-fonts`, as
# vansoncraft-ui-egui's. Off, for an embedder that supplies every document font at run time.
bundled-fonts = ["vansoncraft-engine/bundled-fonts"]

[dependencies]
vansoncraft-engine = { workspace = true }
vansoncraft-render = { workspace = true }
vansoncraft-svg = { workspace = true }
vansoncraft-format = { workspace = true }
vansoncraft-tools = { workspace = true }
vansoncraft-geom = { workspace = true }
vansoncraft-doc = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

image = { workspace = true }

[dev-dependencies]
vansoncraft-testkit = { workspace = true }
proptest = { workspace = true }
socket2 = { workspace = true }
