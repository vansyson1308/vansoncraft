[package]
name = "vansoncraft-metafile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VansonCraft Windows metafiles: hand-written EMF and WMF writers and readers"

[lints]
workspace = true

[dependencies]
vansoncraft-geom = { workspace = true }
vansoncraft-color = { workspace = true }
vansoncraft-doc = { workspace = true }
vansoncraft-effects = { workspace = true }
vansoncraft-brush = { workspace = true }
vansoncraft-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
vansoncraft-text = { workspace = true, features = ["bundled-fonts"] }
