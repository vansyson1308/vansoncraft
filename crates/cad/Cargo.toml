[package]
name = "vansoncraft-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VansonCraft CAD interchange: a hand-written ASCII DXF writer (R12 to 2018) and an HP-GL/2 plot file reader and writer"

[lints]
workspace = true

[dependencies]
vansoncraft-geom = { workspace = true }
vansoncraft-color = { workspace = true }
vansoncraft-doc = { workspace = true }
vansoncraft-effects = { workspace = true }
vansoncraft-brush = { workspace = true }
vansoncraft-pathops = { workspace = true }
vansoncraft-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine)
# and in fonts built in code (`vansoncraft_text::test_fonts`).
vansoncraft-text = { workspace = true, features = ["bundled-fonts", "test-fonts"] }
