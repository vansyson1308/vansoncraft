[package]
name = "vansoncraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "VansonCraft command line: MCP server (stdio) and headless batch runs"

[[bin]]
name = "vansoncraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vansoncraft-color = { workspace = true }
vansoncraft-doc = { workspace = true }
vansoncraft-engine = { workspace = true, features = ["bundled-fonts", "heif"] }
vansoncraft-format = { workspace = true }
vansoncraft-geom = { workspace = true }
vansoncraft-svg = { workspace = true }
vansoncraft-mcp = { workspace = true }
vansoncraft-render = { workspace = true }
vansoncraft-text = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `setup`'s backup names (AGENTS.md: time goes through chrono).
chrono = { workspace = true }
# `doctor` reads Codex's config.toml (the same crate the desktop app already builds).
toml = "1"

# `perf` on Windows (src/perf.rs) reads how busy the processors are (GetSystemTimes) and this
# process's working set (GetProcessMemoryInfo) through winsafe's safe wrappers over Win32 (MIT),
# which the desktop app's src/gpu.rs also uses.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["kernel", "psapi"] }

# DirectWrite's system font collection and GDI's font list (the desktop app's src/system_fonts.rs,
# shared): fonts that font services such as Adobe Fonts load in place (#579, #1258). MIT OR
# Apache-2.0. Win32_System_Threading has `GetProcessAffinityMask`, which the desktop app's
# src/windows_cores.rs, shared, uses to count the cores the process may run on.
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_System_Threading"] }

# CoreText's font manager (the desktop app's src/mac_fonts.rs, shared): fonts that apps and font
# managers register from their own folders (#579). Zlib OR Apache-2.0 OR MIT.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontManager"] }

[dev-dependencies]
tempfile = "3"
vansoncraft-testkit = { workspace = true }
serde_json = { workspace = true }
